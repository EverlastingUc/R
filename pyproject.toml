[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-neural-network"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6"]

[project.optional-dependencies]
llm = ["torch>=2.6"]

[project.scripts]
gluons = "proton_i.gluons.__main__:main"
valence = "proton_i.valence.__main__:main"
valence-api = "proton_i.valence.api:main"
entropy-train = "entropy_lm.training:main"
entropy-generate = "entropy_lm.inference:main"
entropy-prepare-corpus = "entropy_lm.corpus:main"
entropy-evaluate = "entropy_lm.evaluation:main"
entropy-prepare-chat = "entropy_lm.chat_data:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"
