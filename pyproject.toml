[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "entropy-neural-network"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6"]

[project.scripts]
gluons = "proton_i.gluons.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"
